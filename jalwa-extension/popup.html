<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Go Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            min-height: 200px;
            background: #0a0f1e;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .title {
            font-size: 1rem;
            font-weight: 900;
            color: #a5b4fc;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 3px;
        }

        .status-box {
            background: #1a2035;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #3b82f622;
            font-size: 0.75rem;
            color: #94a3b8;
            min-height: 40px;
            line-height: 1.5;
        }

        .numbers-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .num-chip {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
        }

        .num-chip.big {
            background: #10b981;
        }

        .num-chip.small {
            background: #f43f5e;
        }

        .num-chip.violet {
            background: #8b5cf6;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .btn-sync {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-open {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .count-badge {
            display: inline-block;
            background: #10b981;
            color: white;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-left: 6px;
        }

        .error {
            color: #f43f5e;
        }

        .success {
            color: #10b981;
        }

        .divider {
            border-top: 1px solid #1e293b;
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="title">🎯 WIN GO SYNC</div>
        <div class="subtitle">Jalwa History → Predictor Pro</div>
    </div>

    <div class="status-box" id="statusBox">
        Open Jalwa Win Go page, then click "Read History".
    </div>

    <button class="btn btn-primary" id="readBtn">📥 Read Jalwa History</button>
    <button class="btn btn-sync" id="syncBtn" disabled>🔄 Sync to Predictor Tool</button>
    <div class="divider"></div>
    <button class="btn btn-open" id="openBtn">🚀 Open Predictor Tool</button>

    <script src="popup.js"></script>
</body>

</html>
